# =============================================================================
# CityGo 生产环境配置 (prod)
# 【占位结构】本阶段仅搭建配置骨架，不承载真实生产参数。
# 生产环境的关键信息（数据库地址、密码等）一律通过环境变量注入，严禁硬编码。
# =============================================================================
server:
  # 生产端口，可通过环境变量覆盖
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库地址通过环境变量注入，默认回退到 localhost 便于结构验证
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:citygo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:citygo_user}
    password: ${MYSQL_PASSWORD:}

# 日志级别
logging:
  level:
    root: info