# =============================================================================
# CityGo 开发环境配置 (dev)
# 用于本地开发调试，连接本机 Docker 中的 MySQL (knowflow-mysql) 容器
# =============================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/citygo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 密码优先取环境变量 MYSQL_PASSWORD，未设置时回退到默认值 Citygo@2026。
    # 这样既能在本地零配置启动（用默认值），又允许通过环境变量注入真实密码，避免硬编码泄露。
    username: citygo_user
    password: ${MYSQL_PASSWORD:Citygo@2026}

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 数据库下划线列名 <-> Java 驼峰属性名自动映射
    map-underscore-to-camel-case: true
    # 开启 SQL 日志输出（基于 SLF4J），便于学习 MyBatis 实际执行的 SQL 与参数
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    # 关闭 MyBatis-Plus 启动横幅
    banner: false
    db-config:
      # 逻辑删除字段名（为后续软删除功能预留）
      logic-delete-field: deleted
      # 逻辑删除：已删除标记为 1
      logic-delete-value: 1
      # 逻辑删除：未删除标记为 0
      logic-not-delete-value: 0
  # Mapper XML 文件扫描路径
  mapper-locations: classpath*:mapper/**/*.xml

# 日志级别
logging:
  level:
    root: info
    # 业务包输出 debug 日志，便于本地开发观测
    com.citygo: debug