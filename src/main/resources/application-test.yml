# =============================================================================
# CityGo 测试环境配置 (test)
# 与 dev 共用本机 MySQL 容器，仅调整日志级别以减少测试输出噪音
# =============================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/citygo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 与 dev 一致的取值策略：环境变量优先，默认值兜底
    username: citygo_user
    password: ${MYSQL_PASSWORD:Citygo@2026}
  # Redis：测试环境连接本机 Redis（默认 localhost:6379）
  data:
    redis:
      host: localhost
      port: 6379
  # RabbitMQ：测试环境连接本机 knowflow-rabbitmq 容器（官方镜像默认 guest/guest）
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          # SB4 新语义：max-retries=重试次数，共 3 次尝试
          max-retries: 2
        # 重试耗尽拒绝并不回队（进 DLX），避免消费者异常导致消息无限重排队列卡死测试
        default-requeue-rejected: false

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 测试环境关闭 SQL 日志输出，保持测试输出整洁
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# 日志级别：关闭 debug，root 保持 info
logging:
  level:
    root: info

# JWT 配置（测试环境取值与 dev 保持一致，便于集成测试；生产通过环境变量覆盖）
citygo:
  jwt:
    # HS256 密钥，>= 32 字节；仅用于开发/测试，生产必须走环境变量
    secret: citygo-dev-secret-key-please-change-in-prod-0123456789
    # token 有效期（秒）
    expire-seconds: 86400
  order:
    # 订单超时分钟数（测试通过消息级 TTL 覆盖，此默认值不生效）
    timeout-minutes: 30