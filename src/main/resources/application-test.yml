# =============================================================================
# CityGo 测试环境配置 (test)
# 与 dev 共用本机 MySQL 容器，仅调整日志级别以减少测试输出噪音
# =============================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/citygo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 与 dev 一致的取值策略：环境变量优先，默认值兜底
    username: citygo_user
    password: ${MYSQL_PASSWORD:Citygo@2026}

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 测试环境关闭 SQL 日志输出，保持测试输出整洁
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# 日志级别：关闭 debug，root 保持 info
logging:
  level:
    root: info